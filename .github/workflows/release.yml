# $schema: https://json.schemastore.org/github-workflow.json
---
name: Release

# Tags cut releases. Every push to main rehearses the same release
# procedure inside the runner and publishes nothing (ADR-023). Pull requests
# only validate the release config, in the CI workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # The release rehearsal (ADR-023): the documented release procedure, run
  # inside the runner. It batches the changelog, commits, tags and pushes
  # multi-platform images with their SBOM attestations, then checks the
  # result against the release contract. Nothing leaves the runner: the
  # commit and the tag are never pushed, the registry service dies with the
  # job, the GitHub release is switched off and nothing is signed. Pushes to
  # main and manual runs rehearse; tag pushes release for real instead.
  rehearsal:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    env:
      PATCHCASTER_IMAGE_REPO: localhost:5000/patchcaster
      PATCHCASTER_RELEASE_REHEARSAL: "true"
    steps:
      # Full history and tags: changie and goreleaser derive versions from
      # them, as in the release job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/changie/go.sum
            tools/golangci/go.sum
            tools/sqlc/go.sum
            tools/goreleaser/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      # The release job's builder, plus host networking so that BuildKit
      # can reach the registry service on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Validate release config
        run: just release-check

      # A placeholder fragment keeps the batch working right after a
      # release, when no fragments are pending.
      - name: Batch the changelog as for a release
        run: |
          git config user.name "Release rehearsal"
          git config user.email "release-rehearsal@invalid"
          just change --interactive=false -k Fixed -b "Release rehearsal placeholder."
          just release-changelog
          git add --all
          git commit --quiet --message "Rehearse the release changelog"

      - name: Tag as for a release
        run: just release-tag

      - name: Release into the throwaway registry
        run: just release-publish --skip=sign

      - name: Check the rehearsed release
        run: .github/scripts/check-release-rehearsal.sh

  # Only a pushed v* tag publishes. A push to main matches the push event
  # too, so the ref decides.
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io push
      id-token: write # cosign keyless OIDC identity (ADR-016)
    steps:
      # Full history and tags: goreleaser derives the version and previous tag
      # from git, and `just release-publish` finds the tag's changelog (ADR-018).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/golangci/go.sum
            tools/sqlc/go.sum
            tools/goreleaser/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      # cosign for keyless signing (ADR-016). The installer checks the
      # binary's signatures before it reaches PATH.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # A docker-container builder supports multi-platform pushes, index
      # annotations and SBOM attestations, whatever image store the
      # runner's Docker daemon uses (ADR-022).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # v2.18 OSS has no docker_login pipeline; the daemon credential is the
      # standard ghcr pattern using the workflow token.
      - name: Login to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: just release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
