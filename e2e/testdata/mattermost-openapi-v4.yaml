  /api/v4/users/tokens/rotate:
    post:
      tags:
        - users
      summary: Rotate a personal access token
      description: >
        Generate a new secret for an existing personal access token, immediately
        invalidating the old secret and any sessions that used it. The response
        includes the new token secret (shown once, like token creation).


        __Minimum server version__: 10.10


        ##### Permissions

        Must have `create_user_access_token` permission. For non-self requests,
        must also have the `edit_other_users` permission. To rotate a token
        belonging to a system admin, must also have the `manage_system`
        permission. OAuth sessions cannot use this endpoint.
      operationId: RotateUserAccessToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - token_id
              properties:
                token_id:
                  description: The personal access token GUID to rotate
                  type: string
                expires_at:
                  description: >
                    New expiry for the token as a Unix timestamp in milliseconds.
                    Use 0 for no expiry (subject to server policy).
                  type: integer
                  format: int64
        required: true
      responses:
        "200":
          description: Personal access token rotation successful; response includes the new secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
