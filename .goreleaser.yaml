# $schema: https://goreleaser.com/static/schema.json
---
# Release pipeline (ADR-015, SYSREQ-031), driven by the pinned tool in
# tools/goreleaser. Validate with `just release-check`; dry-run with
# `just release-snapshot`. Publishing happens only from the tag-triggered
# workflow (or an explicit `just release-publish` with GITHUB_TOKEN exported).
version: 2

project_name: patchcaster

builds:
  - id: patchcaster
    main: ./cmd/patchcaster
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

checksum:
  name_template: "checksums.txt"

# Archives carry the binary and LICENSE only (ADR-020). Setting files
# replaces goreleaser's defaults, which would also pack the README and the
# changelog. LICENSE stays because MIT requires its notice in every copy.
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

# Draft releases keep cuts reviewable before they become public.
release:
  draft: true

# One entry, both platforms: goreleaser runs `docker buildx build
# --platform linux/amd64,linux/arm64` and publishes a manifest list per
# image:tag. The COPY-only Dockerfile selects the staged binary via
# TARGETPLATFORM (goreleaser stages linux/<arch>/<binary>), so no QEMU runs
# any target binary (ADR-015). Registry login is the workflow's job:
# v2.18 OSS has no docker_login step.
dockers_v2:
  - id: patchcaster
    images:
      - "ghcr.io/patchcaster-app/patchcaster"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64

# Keyless cosign signing (ADR-016, SYSREQ-032). No keys exist: on GitHub
# Actions cosign obtains the workflow's OIDC identity, Fulcio issues a short
# certificate, and Rekor records the entry. `sign-blob --bundle` writes the
# signature, certificate and log entry as one Sigstore bundle,
# checksums.txt.sigstore.json, which is uploaded with the release and checked
# with `verify-blob --bundle`. Image signatures are attached to the images in
# the registry. There is no identity to obtain outside Actions, so snapshots
# must --skip=sign (the release-snapshot task does). goreleaser resolves
# `cosign` from PATH, where the release workflow's cosign-installer step puts
# it.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

# Release notes are the tag's changie batch (ADR-018): `just
# release-publish` passes .changes/<tag>.md via --release-notes, which
# replaces the commit-log changelog. Never set changelog.disable: it skips
# the whole changelog step, including loading that file, and would publish
# an empty release body.
