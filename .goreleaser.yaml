# $schema: https://goreleaser.com/static/schema.json
---
# Release pipeline (ADR-015, SYSREQ-031), driven by the pinned tool in
# tools/goreleaser. Validate with `just release-check`; dry-run with
# `just release-snapshot`. Publishing happens only from the tag-triggered
# workflow (or an explicit `just release-publish` with GITHUB_TOKEN exported).
version: 2

project_name: patchcaster

builds:
  - id: patchcaster
    main: ./cmd/patchcaster
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds (ADR-021): the binary carries the commit's time,
    # not the time of the build.
    mod_timestamp: "{{ .CommitTimestamp }}"

checksum:
  name_template: "checksums.txt"

# Archives carry the binary and the licence only (ADR-020, ADR-024): the
# AGPL text and the proxy grant, because the AGPL requires a copy of the
# licence in every copy. Setting files replaces goreleaser's defaults, which
# would also pack the README and the changelog.
#
# Every entry's metadata is pinned so that the same tag packs the same bytes
# on any machine (ADR-021). Otherwise the archive records the builder's
# clock, user, group and umask.
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &pinned_licence_file
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSES/LicenseRef-PatchCaster-Accepted-AGPL.txt
        info: *pinned_licence_file

# Draft releases keep cuts reviewable before they become public. The CI
# release rehearsal sets PATCHCASTER_RELEASE_REHEARSAL, which switches the
# GitHub release off entirely (ADR-023). Real releases leave it unset.
release:
  draft: true
  disable: '{{ isEnvSet "PATCHCASTER_RELEASE_REHEARSAL" }}'

# One entry, both platforms: goreleaser runs `docker buildx build
# --platform linux/amd64,linux/arm64` and publishes a manifest list per
# image:tag. The COPY-only Dockerfile selects the staged binary via
# TARGETPLATFORM (goreleaser stages linux/<arch>/<binary>), so no QEMU runs
# any target binary (ADR-015). Registry login is the workflow's job:
# v2.18 OSS has no docker_login step.
dockers_v2:
  - id: patchcaster
    # The CI release rehearsal points PATCHCASTER_IMAGE_REPO at a throwaway
    # local registry (ADR-023). Real releases leave it unset.
    images:
      - '{{ envOrDefault "PATCHCASTER_IMAGE_REPO" "ghcr.io/patchcaster-app/patchcaster" }}'
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    # The licence texts travel into the build context, where the Dockerfile
    # copies them into the image (ADR-024).
    extra_files:
      - LICENSE
      - LICENSES/LicenseRef-PatchCaster-Accepted-AGPL.txt
    # Every pushed image carries an SBOM attestation per platform (ADR-022).
    # This is goreleaser's default, set here so the decision stays visible.
    sbom: "true"
    # OCI metadata, twice: labels sit in each image's config, where `docker
    # inspect` shows them, and annotations sit on the image index, where
    # GitHub's registry reads the source, description and licence of a
    # multi-architecture image. The created time is the commit's, so the
    # metadata does not depend on when the image was built (ADR-021).
    labels: &oci_metadata
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "From forge to chat: one live thread per merge request."
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.source: "https://github.com/patchcaster-app/patchcaster"
      org.opencontainers.image.documentation: "https://github.com/patchcaster-app/patchcaster/tree/{{ .Tag }}/docs"
      org.opencontainers.image.licenses: "AGPL-3.0-only OR LicenseRef-PatchCaster-Accepted-AGPL"
      org.opencontainers.image.base.name: "{{ .BaseImage }}"
      org.opencontainers.image.base.digest: "{{ .BaseImageDigest }}"
    annotations: *oci_metadata

# Keyless cosign signing (ADR-016, SYSREQ-032). No keys exist: on GitHub
# Actions cosign obtains the workflow's OIDC identity, Fulcio issues a short
# certificate, and Rekor records the entry. `sign-blob --bundle` writes the
# signature, certificate and log entry as one Sigstore bundle,
# checksums.txt.sigstore.json, which is uploaded with the release and checked
# with `verify-blob --bundle`. Image signatures are attached to the images in
# the registry. There is no identity to obtain outside Actions, so snapshots
# must --skip=sign (the release-snapshot task does). goreleaser resolves
# `cosign` from PATH, where the release workflow's cosign-installer step puts
# it.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

# Release notes are the tag's changie batch (ADR-018): `just
# release-publish` passes .changes/<tag>.md via --release-notes, which
# replaces the commit-log changelog. Never set changelog.disable: it skips
# the whole changelog step, including loading that file, and would publish
# an empty release body.
