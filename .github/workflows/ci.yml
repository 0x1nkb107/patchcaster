# $schema: https://json.schemastore.org/github-workflow.json
---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # Static gates: formatting, CGO-free build, vet, pinned golangci-lint, and
  # the web interface's lint, build and audit (ADR-032, ADR-042).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
            tools/golangci/go.sum
            tools/sqlc/go.sum
            tools/ogen/go.sum
            tools/goreleaser/go.sum

      # Recent Node 24 releases bundle npm 11.10.0 or later, which honours
      # the release age in web/.npmrc. The web recipes refuse an older npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Install web interface packages
        run: just web-install

      - name: Quality gate
        run: just quality

      - name: Build web interface
        run: just web-build

      - name: Audit web interface packages
        run: just web-audit

      # The release rehearsal runs only on main (ADR-023). Validating the
      # config here keeps a broken one from merging.
      - name: Validate release config
        run: just release-check

  # The store contract tests start their own PostgreSQL container on the
  # runner's Docker (ADR-026) and fail rather than skip without one.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Unit and integration tests
        run: just test -count=1

  # Concurrent code (lease reaping, drain, claim loop) earns its keep under
  # -race; the store suite runs here too so pgx paths get race coverage. It
  # starts its own PostgreSQL container, as in the test job.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Test with race detection
        run: just race -count=1

  # The real binary as a separate process: signals, restarts, wake-ups and
  # the queue against PostgreSQL and a fake Mattermost (ADR-025). The suite
  # starts its own PostgreSQL container through the runner's Docker.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: End-to-end tests
        run: just test-e2e -v
