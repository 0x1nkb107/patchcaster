# The management API, version 1 (SYSREQ-035, ADR-031, ADR-043). This
# description is the source: `just api` generates the server and the e2e
# client from it, and the binary serves it at /api/v1/openapi.yaml.
openapi: 3.0.3
info:
  title: PatchCaster management API
  version: "1"
  description: >-
    Every configuration operation of the web interface, for automation. Errors
    are RFC 9457 problem details; validation errors list each field by its
    path. Clients authenticate with the session cookie of a login, or with an
    API token as a bearer token. Only a login manages API tokens.
servers:
  - url: /
security:
  - session: []
  - token: []
paths:
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Describe this instance.
      security: []
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/setup:
    post:
      operationId: setUp
      summary: Configure the identity provider during the first setup.
      description: >-
        Takes the setup link's token from the bootstrap command, checks that
        the provider answers, and stores it. The response names the login
        that makes the person logging in the first administrator. Fails once
        an administrator exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The provider is stored; log in to finish the setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStarted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the person this session belongs to.
      responses:
        "200":
          description: The person logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: endSession
      summary: Log out.
      security:
        - session: []
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons:
    get:
      operationId: listPersons
      summary: List people, for administrators.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of people, in the order they first logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons/{id}:
    patch:
      operationId: updatePerson
      summary: Change a person's role, for administrators.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: The changed person.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons/{id}/revoke-access:
    post:
      operationId: revokeAccess
      summary: Revoke all tokens and end all sessions of a person, for administrators.
      description: >-
        Takes effect at once. The person can log in again, unless the identity
        provider refuses them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The person's tokens are revoked and their sessions ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRevoked"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: List your own API tokens, including revoked and expired ones.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of tokens, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create an API token that acts with your permissions.
      description: >-
        The response holds the token itself, which is shown only this once.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenRequest"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke one of your own API tokens.
      description: >-
        Revoking a revoked token changes nothing, so no If-Match is needed.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The token is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/settings/login:
    get:
      operationId: getLoginSettings
      summary: Read the identity provider settings, for administrators.
      responses:
        "200":
          description: The settings, without the client secret.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putLoginSettings
      summary: Change the identity provider settings, for administrators.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginSettingsUpdate"
      responses:
        "200":
          description: The changed settings.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSettings"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Read the audit log, newest first, for administrators.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: patchcaster_session
      description: The session cookie the login sets.
    token:
      type: http
      scheme: bearer
      description: An API token, created by its owner during a login.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Where the page starts, from the previous page's next_cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many items the page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the resource as last read. A change without it, or with an old one, is refused.
      schema:
        type: string
  headers:
    ETag:
      description: The resource's current version, for If-Match.
      schema:
        type: string
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SetupRequest:
      type: object
      required: [setup_token, issuer, client_id, client_secret]
      properties:
        setup_token:
          type: string
          minLength: 1
          description: The token from the setup link.
        issuer:
          type: string
          minLength: 1
          description: The OpenID Connect issuer URL.
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
        groups_claim:
          type: string
          description: The ID token claim that lists a person's groups. Empty admits everyone the provider authenticates.
        allowed_groups:
          type: array
          items:
            type: string
          description: The groups whose members may log in. Empty admits everyone.
    SetupStarted:
      type: object
      required: [login_url]
      properties:
        login_url:
          type: string
          description: Log in here to become the first administrator.
    Person:
      type: object
      required: [id, issuer, subject, display_name, email, administrator, etag]
      properties:
        etag:
          type: string
          description: The person's current version, for If-Match on a change.
        id:
          type: integer
          format: int64
        issuer:
          type: string
        subject:
          type: string
        display_name:
          type: string
        email:
          type: string
        administrator:
          type: boolean
    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        next_cursor:
          type: string
          description: Absent on the last page.
    PersonUpdate:
      type: object
      required: [administrator]
      properties:
        administrator:
          type: boolean
    LoginSettings:
      type: object
      required: [issuer, client_id, groups_claim, allowed_groups]
      properties:
        issuer:
          type: string
        client_id:
          type: string
        groups_claim:
          type: string
        allowed_groups:
          type: array
          items:
            type: string
    LoginSettingsUpdate:
      type: object
      required: [issuer, client_id, groups_claim, allowed_groups]
      properties:
        issuer:
          type: string
          minLength: 1
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
          description: A new client secret. Absent keeps the current one.
        groups_claim:
          type: string
        allowed_groups:
          type: array
          items:
            type: string
    AuditEntry:
      type: object
      required: [id, at, actor, action, target_kind, target_id]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Who acted, as their name was then.
        actor_person_id:
          type: integer
          format: int64
        actor_token:
          type: string
          description: The token the actor used, by its name then. Absent for a login.
        actor_token_id:
          type: integer
          format: int64
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        before:
          description: The target before the change, with secrets redacted.
        after:
          description: The target after the change, with secrets redacted.
    ApiToken:
      type: object
      required: [id, name, created_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Absent while the token is not revoked.
    ApiTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          type: string
          description: Absent on the last page.
    ApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the token is for, such as the job that uses it.
        lifetime_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 90
          description: How many days the token works.
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        secret:
          type: string
          description: The token to send as a bearer token. It is shown only once.
    AccessRevoked:
      type: object
      required: [revoked_tokens]
      properties:
        revoked_tokens:
          type: integer
          description: How many working tokens were revoked.
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Absent on the last page.
    Instance:
      type: object
      required: [version, setup_required]
      properties:
        setup_required:
          type: boolean
          description: True until the first administrator has logged in.
        version:
          type: string
          description: The build version, "dev" for source builds.
    Problem:
      type: object
      description: An RFC 9457 problem.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI that identifies the kind of problem.
        title:
          type: string
          description: A short summary of the kind of problem.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong in this case.
        errors:
          type: array
          description: >-
            The fields that failed validation, each named by its path the way
            form libraries do, such as "routes[0].sink_id". An empty path means
            the request as a whole.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, messages]
      properties:
        path:
          type: string
        messages:
          type: array
          items:
            type: string
