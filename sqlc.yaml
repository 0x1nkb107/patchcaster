# $schema: https://www.schemastore.org/sqlc-2.0.json
---
version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        sql_package: "database/sql"
        emit_exact_table_names: false
