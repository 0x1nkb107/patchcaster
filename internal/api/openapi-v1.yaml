# The management API, version 1 (SYSREQ-035, ADR-031, ADR-043). This
# description is the source: `just api` generates the server and the e2e
# client from it, and the binary serves it at /api/v1/openapi.yaml.
openapi: 3.0.3
info:
  title: PatchCaster management API
  version: "1"
  description: >-
    Every configuration operation of the web interface, for automation. Errors
    are RFC 9457 problem details; validation errors list each field by its
    path. Clients authenticate with the session cookie of a login, or with an
    API token as a bearer token. Only a login manages API tokens.
servers:
  - url: /
security:
  - session: []
  - token: []
paths:
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Describe this instance.
      security: []
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/setup:
    post:
      operationId: setUp
      summary: Configure the identity provider during the first setup.
      description: >-
        Takes the setup link's token from the bootstrap command, checks that
        the provider answers, and stores it. The response names the login
        that makes the person logging in the first Instance Admin. Fails once
        an Instance Admin exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The provider is stored; log in to finish the setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStarted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Describe the person this session belongs to.
      responses:
        "200":
          description: The person logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: endSession
      summary: Log out.
      security:
        - session: []
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons:
    get:
      operationId: listPersons
      summary: List people, for Instance Admins.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of people, in the order they first logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons/{id}:
    patch:
      operationId: updatePerson
      summary: Change a person's role, for Instance Admins.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: The changed person.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/persons/{id}/revoke-access:
    post:
      operationId: revokeAccess
      summary: Revoke all tokens and end all sessions of a person, for Instance Admins.
      description: >-
        Takes effect at once. The person can log in again, unless the identity
        provider refuses them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The person's tokens are revoked and their sessions ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRevoked"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: List your own API tokens, including revoked and expired ones.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of tokens, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create an API token that acts with your permissions.
      description: >-
        The response holds the token itself, which is shown only this once.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenRequest"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke one of your own API tokens.
      description: >-
        Revoking a revoked token changes nothing, so no If-Match is needed.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The token is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/connections:
    get:
      operationId: listConnections
      summary: List the forge and chat connections, for Instance Admins.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of connections, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConnection
      summary: Connect a forge or a chat platform, for Instance Admins.
      description: >-
        A credential is checked against the platform before it is stored, and
        the account it acts as is shown. A chat connection needs its bot's
        token. A forge connection without one receives webhooks, but cannot
        register them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "201":
          description: The new connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/connections/{id}:
    get:
      operationId: getConnection
      summary: Read a connection, without its credential, for Instance Admins.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The connection.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateConnection
      summary: Change a connection, for Instance Admins.
      description: >-
        Its kind stays. A new credential, or a new base URL with the stored
        credential, is checked against the platform first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdate"
      responses:
        "200":
          description: The changed connection.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConnection
      summary: Remove a connection and its signing tokens, for Instance Admins.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The connection is gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/connections/{id}/signing-tokens:
    get:
      operationId: listSigningTokens
      summary: List a forge connection's webhook signing tokens, without their values.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of signing tokens, in the order they were added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningTokenPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addSigningToken
      summary: Add a webhook signing token to a forge connection, for Instance Admins.
      description: >-
        Any of a connection's signing tokens may sign a delivery, so a token
        rotates without downtime: add the new one, switch the hook over, then
        remove the old one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigningTokenRequest"
      responses:
        "201":
          description: The token is added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningToken"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/connections/{id}/signing-tokens/{token_id}:
    delete:
      operationId: removeSigningToken
      summary: Remove a webhook signing token, for Instance Admins.
      description: >-
        Deliveries signed with it are refused from then on. Like a revocation,
        it needs no If-Match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The token is removed.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: List teams. Instance Admins see all of them, Routing Managers the ones they manage.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      summary: Create a team, for Instance Admins.
      description: >-
        A new team has no Routing Managers, sources or sinks. Give it them with a change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequest"
      responses:
        "201":
          description: The new team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      summary: Read a team. Routing Managers read only the teams they manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The team.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateTeam
      summary: Change a team, for Instance Admins.
      description: >-
        Renames the team and sets its Routing Managers, sources and sinks. A source or sink that one of the team's routes uses cannot leave it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: The changed team.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTeam
      summary: Remove a team, for Instance Admins.
      description: >-
        A team with routes cannot go. Remove its routes first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The team is gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sources:
    get:
      operationId: listSources
      summary: List sources. Instance Admins see all of them, Routing Managers those of the teams they manage.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSource
      summary: Create a source of a forge connection, for Instance Admins.
      description: >-
        A source selects the repositories of its connection by scope: the whole instance, a group, or one repository. Assign it to teams with a team change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRequest"
      responses:
        "201":
          description: The new source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sources/{id}:
    get:
      operationId: getSource
      summary: Read a source. Routing Managers read only those of the teams they manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The source.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSource
      summary: Change a source's name or scope, for Instance Admins.
      description: >-
        Its connection stays.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: The changed source.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSource
      summary: Remove a source, for Instance Admins.
      description: >-
        A source a route uses cannot go. It leaves its teams with it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The source is gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sinks:
    get:
      operationId: listSinks
      summary: List sinks. Instance Admins see all of them, Routing Managers those of the teams they manage.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSink
      summary: Create a sink in a channel of a chat connection, for Instance Admins.
      description: >-
        PatchCaster first checks that the connection's bot can post into the channel, and refuses the sink with the reason when it cannot. Assign it to teams with a team change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkRequest"
      responses:
        "201":
          description: The new sink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sinks/{id}:
    get:
      operationId: getSink
      summary: Read a sink. Routing Managers read only those of the teams they manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The sink.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSink
      summary: Change a sink's name or channel, for Instance Admins.
      description: >-
        A new channel is checked like a new sink. Its connection stays.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkUpdate"
      responses:
        "200":
          description: The changed sink.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSink
      summary: Remove a sink, for Instance Admins.
      description: >-
        A sink a route uses cannot go. It leaves its teams with it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The sink is gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/routes:
    get:
      operationId: listRoutes
      summary: List routes. Instance Admins see all of them, Routing Managers those of the teams they manage.
      parameters:
        - name: team_id
          in: query
          description: Only the routes of this team.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, in the order they were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRoute
      summary: Create a route from a team's source into one of its sinks, for the team's Routing Managers and Instance Admins.
      description: >-
        A route forwards every merge request of the source into the sink. Muted replies are not posted, but the board in the sink still shows every change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "201":
          description: The new route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/routes/{id}:
    get:
      operationId: getRoute
      summary: Read a route. Routing Managers read only those of the teams they manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The route.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateRoute
      summary: Change which replies a route mutes, for the team's Routing Managers and Instance Admins.
      description: >-
        Its team, source and sink stay. To route elsewhere, create another route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteUpdate"
      responses:
        "200":
          description: The changed route.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRoute
      summary: Remove a route, for the team's Routing Managers and Instance Admins.
      description: >-
        Messages the route already queued are still delivered.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The route is gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/settings/login:
    get:
      operationId: getLoginSettings
      summary: Read the identity provider settings, for Instance Admins.
      responses:
        "200":
          description: The settings, without the client secret.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putLoginSettings
      summary: Change the identity provider settings, for Instance Admins.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginSettingsUpdate"
      responses:
        "200":
          description: The changed settings.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSettings"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Read the audit log, newest first, for Instance Admins.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: patchcaster_session
      description: The session cookie the login sets.
    token:
      type: http
      scheme: bearer
      description: An API token, created by its owner during a login.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Where the page starts, from the previous page's next_cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many items the page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the resource as last read. A change without it, or with an old one, is refused.
      schema:
        type: string
  headers:
    ETag:
      description: The resource's current version, for If-Match.
      schema:
        type: string
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SetupRequest:
      type: object
      required: [setup_token, issuer, client_id, client_secret]
      properties:
        setup_token:
          type: string
          minLength: 1
          description: The token from the setup link.
        issuer:
          type: string
          minLength: 1
          description: The OpenID Connect issuer URL.
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
        groups_claim:
          type: string
          description: The ID token claim that lists a person's groups. Empty admits everyone the provider authenticates.
        allowed_groups:
          type: array
          items:
            type: string
          description: The groups whose members may log in. Empty admits everyone.
    SetupStarted:
      type: object
      required: [login_url]
      properties:
        login_url:
          type: string
          description: Log in here to become the first Instance Admin.
    Person:
      type: object
      required: [id, issuer, subject, display_name, email, administrator, etag]
      properties:
        etag:
          type: string
          description: The person's current version, for If-Match on a change.
        id:
          type: integer
          format: int64
        issuer:
          type: string
        subject:
          type: string
        display_name:
          type: string
        email:
          type: string
        administrator:
          type: boolean
          description: Whether the person is an Instance Admin, who configures the instance and its access.
    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        next_cursor:
          type: string
          description: Absent on the last page.
    PersonUpdate:
      type: object
      required: [administrator]
      properties:
        administrator:
          type: boolean
          description: Makes the person an Instance Admin, or takes the role away. Routing Managers are assigned per team.
    LoginSettings:
      type: object
      required: [issuer, client_id, groups_claim, allowed_groups]
      properties:
        issuer:
          type: string
        client_id:
          type: string
        groups_claim:
          type: string
        allowed_groups:
          type: array
          items:
            type: string
    LoginSettingsUpdate:
      type: object
      required: [issuer, client_id, groups_claim, allowed_groups]
      properties:
        issuer:
          type: string
          minLength: 1
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
          description: A new client secret. Absent keeps the current one.
        groups_claim:
          type: string
        allowed_groups:
          type: array
          items:
            type: string
    AuditEntry:
      type: object
      required: [id, at, actor, action, target_kind, target_id]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Who acted, as their name was then.
        actor_person_id:
          type: integer
          format: int64
        actor_token:
          type: string
          description: The token the actor used, by its name then. Absent for a login.
        actor_token_id:
          type: integer
          format: int64
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        before:
          description: The target before the change, with secrets redacted.
        after:
          description: The target after the change, with secrets redacted.
    ApiToken:
      type: object
      required: [id, name, created_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Absent while the token is not revoked.
    ApiTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          type: string
          description: Absent on the last page.
    ApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the token is for, such as the job that uses it.
        lifetime_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 90
          description: How many days the token works.
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        secret:
          type: string
          description: The token to send as a bearer token. It is shown only once.
    AccessRevoked:
      type: object
      required: [revoked_tokens]
      properties:
        revoked_tokens:
          type: integer
          description: How many working tokens were revoked.
    ConnectionKind:
      type: string
      enum: [gitlab, mattermost]
      description: The platform. GitLab is a forge, Mattermost a chat platform.
    Connection:
      type: object
      required: [id, kind, name, base_url, account, has_credential, health, etag]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ConnectionKind"
        name:
          type: string
        base_url:
          type: string
        account:
          type: string
          description: Whom the credential acted as when it was last checked. Empty without one.
        has_credential:
          type: boolean
        webhook_url:
          type: string
          description: Where a forge sends this connection's webhooks. Absent for a chat connection.
        health:
          $ref: "#/components/schemas/ConnectionHealth"
        etag:
          type: string
          description: The connection's current version, for If-Match on a change.
    ConnectionHealth:
      type: object
      description: >-
        How the connection works. A forge connection reports the deliveries it sends, a chat
        connection the messages of all its sinks. Health changes with every delivery and is
        not part of the connection's version.
      properties:
        last_delivery_at:
          type: string
          format: date-time
          description: Forge only. When an authentic delivery last arrived. Absent before the first.
        last_rejection_at:
          type: string
          format: date-time
          description: Forge only. When a delivery was last rejected. Absent before the first rejection.
        last_rejection:
          type: string
          enum: [signature, parse]
          description: Forge only. Why the last rejected delivery was rejected.
        waiting_messages:
          type: integer
          format: int64
          description: Chat only. Messages queued for the connection's sinks and not yet delivered.
        oldest_waiting_since:
          type: string
          format: date-time
          description: Chat only. When the oldest waiting message was queued. Absent when none waits.
        last_success_at:
          type: string
          format: date-time
          description: Chat only. When the platform last accepted a message for any of the sinks.
        last_failure_at:
          type: string
          format: date-time
          description: Chat only. When an attempt at the platform last failed, for any of the sinks.
        last_error:
          type: string
          description: Chat only. Why that attempt failed.
    ConnectionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConnectionRequest:
      type: object
      required: [kind, name, base_url]
      properties:
        kind:
          $ref: "#/components/schemas/ConnectionKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        base_url:
          type: string
          minLength: 1
          description: The platform's address, such as https://gitlab.example.org.
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: >-
            The token PatchCaster acts with: an access token for GitLab, the bot
            account's token for Mattermost.
    ConnectionUpdate:
      type: object
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        base_url:
          type: string
          minLength: 1
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: A new credential. Absent keeps the current one.
    SigningToken:
      type: object
      required: [id, label, created_at]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        created_at:
          type: string
          format: date-time
    SigningTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SigningToken"
        next_cursor:
          type: string
          description: Absent on the last page.
    SigningTokenRequest:
      type: object
      required: [label, token]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Which hook signs with it, such as "group payments".
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: The signing token exactly as the forge shows it, such as GitLab's whsec_ form.
    Team:
      type: object
      required: [id, name, managers, sources, sinks, etag]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        managers:
          description: The ids of the team's Routing Managers, the people who route its sources into its sinks.
          type: array
          items:
            type: integer
            format: int64
        sources:
          description: The ids of the sources the team owns.
          type: array
          items:
            type: integer
            format: int64
        sinks:
          description: The ids of the sinks the team owns.
          type: array
          items:
            type: integer
            format: int64
        etag:
          type: string
          description: The team's current version, for If-Match on a change.
    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          type: string
          description: Absent on the last page.
    TeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    TeamUpdate:
      type: object
      required: [name, managers, sources, sinks]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        managers:
          type: array
          items:
            type: integer
            format: int64
        sources:
          type: array
          items:
            type: integer
            format: int64
        sinks:
          type: array
          items:
            type: integer
            format: int64
    SourceScope:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [instance, group, repository]
          description: >-
            The whole forge instance, one group or organization with everything
            below it, or one repository.
        path:
          type: string
          description: >-
            The group's or the repository's full path, such as "payments" or
            "payments/api". Empty for the whole instance.
    Source:
      type: object
      required: [id, connection_id, name, scope, teams, hook, etag]
      properties:
        id:
          type: integer
          format: int64
        connection_id:
          type: integer
          format: int64
        name:
          type: string
        scope:
          $ref: "#/components/schemas/SourceScope"
        teams:
          description: The ids of the teams that own the source.
          type: array
          items:
            type: integer
            format: int64
        hook:
          $ref: "#/components/schemas/SourceHook"
        etag:
          type: string
          description: The source's current version, for If-Match on a change.
    SourceHook:
      type: object
      description: >-
        How the source's events reach PatchCaster. Where the connection has API access,
        PatchCaster registers one hook for every scope no broader source covers. The hook
        changes in the background and is not part of the source's version.
      required: [state]
      properties:
        state:
          type: string
          enum: [registered, pending, failed, covered, manual]
          description: >-
            registered: the hook of the source's scope is registered. pending: it is still
            to be registered. failed: the last attempt failed, see last_error. covered: the
            hook of a broader source takes the events, see covered_by. manual: the connection
            has no API access, so a hook is registered by hand at its webhook_url.
        covered_by:
          $ref: "#/components/schemas/SourceScope"
        last_error:
          type: string
          description: Why the last attempt at the forge failed. Absent after a success.
        registered_at:
          type: string
          format: date-time
          description: When the forge registered the hook. Absent until then.
    SourcePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        next_cursor:
          type: string
          description: Absent on the last page.
    SourceRequest:
      type: object
      required: [connection_id, name, scope]
      properties:
        connection_id:
          type: integer
          format: int64
          description: A forge connection.
        name:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          $ref: "#/components/schemas/SourceScope"
    SourceUpdate:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          $ref: "#/components/schemas/SourceScope"
    Sink:
      type: object
      required: [id, connection_id, name, channel_id, channel_name, teams, health, etag]
      properties:
        id:
          type: integer
          format: int64
        connection_id:
          type: integer
          format: int64
        name:
          type: string
        channel_id:
          type: string
        channel_name:
          type: string
          description: How the platform named the channel when it was last checked.
        teams:
          description: The ids of the teams that own the sink.
          type: array
          items:
            type: integer
            format: int64
        health:
          $ref: "#/components/schemas/SinkHealth"
        etag:
          type: string
          description: The sink's current version, for If-Match on a change.
    SinkHealth:
      type: object
      description: >-
        How messages reach the sink. Health changes with every delivery and is not part of
        the sink's version.
      required: [waiting_messages]
      properties:
        waiting_messages:
          type: integer
          format: int64
          description: Messages queued for the sink and not yet delivered.
        oldest_waiting_since:
          type: string
          format: date-time
          description: When the oldest waiting message was queued. Absent when none waits.
        last_success_at:
          type: string
          format: date-time
          description: When the platform last accepted a message for the sink. Absent before the first.
        last_failure_at:
          type: string
          format: date-time
          description: When an attempt at the platform last failed. Absent before the first failure.
        last_error:
          type: string
          description: Why that attempt failed, as the platform or the network answered.
    SinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sink"
        next_cursor:
          type: string
          description: Absent on the last page.
    SinkRequest:
      type: object
      required: [connection_id, name, channel_id]
      properties:
        connection_id:
          type: integer
          format: int64
          description: A chat connection.
        name:
          type: string
          minLength: 1
          maxLength: 100
        channel_id:
          type: string
          minLength: 1
          description: The channel's id, such as Mattermost shows it in the channel's info.
    SinkUpdate:
      type: object
      required: [name, channel_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        channel_id:
          type: string
          minLength: 1
    ReplyKind:
      type: string
      enum: [comment, review, pipeline, push, merge, close]
      description: >-
        A kind of thread reply: comments, review verdicts, pipeline results,
        new commits, merges and closes.
    Route:
      # The generated server has a Route type of its own.
      x-ogen-name: TeamRoute
      type: object
      required: [id, team_id, source_id, sink_id, muted_replies, etag]
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        source_id:
          type: integer
          format: int64
        sink_id:
          type: integer
          format: int64
        muted_replies:
          type: array
          items:
            $ref: "#/components/schemas/ReplyKind"
          description: The replies the route does not post. The board still shows every change.
        etag:
          type: string
          description: The route's current version, for If-Match on a change.
    RoutePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        next_cursor:
          type: string
          description: Absent on the last page.
    RouteRequest:
      type: object
      required: [team_id, source_id, sink_id]
      properties:
        team_id:
          type: integer
          format: int64
        source_id:
          type: integer
          format: int64
          description: A source the team owns.
        sink_id:
          type: integer
          format: int64
          description: A sink the team owns.
        muted_replies:
          type: array
          items:
            $ref: "#/components/schemas/ReplyKind"
          description: The replies the route does not post. None by default.
    RouteUpdate:
      type: object
      required: [muted_replies]
      properties:
        muted_replies:
          type: array
          items:
            $ref: "#/components/schemas/ReplyKind"
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Absent on the last page.
    Instance:
      type: object
      required: [version, setup_required]
      properties:
        setup_required:
          type: boolean
          description: True until the first Instance Admin has logged in.
        version:
          type: string
          description: The build version, "dev" for source builds.
    Problem:
      type: object
      description: An RFC 9457 problem.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI that identifies the kind of problem.
        title:
          type: string
          description: A short summary of the kind of problem.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong in this case.
        errors:
          type: array
          description: >-
            The fields that failed validation, each named by its path the way
            form libraries do, such as "routes[0].sink_id". An empty path means
            the request as a whole.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, messages]
      properties:
        path:
          type: string
        messages:
          type: array
          items:
            type: string
